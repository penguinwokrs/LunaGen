name: "Auto Release on Merge"

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # コミット件名/本文に [skip release] を含む push はリリースを切らない。
    # push の HEAD コミットのメッセージを見るため、複数コミットを一度に push する
    # 場合は最後のコミットに付けること。他のワークフロー(テスト等)は通常どおり動く。
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # pnpm は pnpm-lock.yaml の形式(lockfileVersion 9.0)に合わせて 10 にする。
      # 2026-09-23 まで 8 のままで、ロックファイルが無視され ^範囲の最新が入り、
      # @ai-sdk/gateway 3.0.198 が混入して v1.19.2 の service worker が起動時に落ちた
      # （TypeError: (0 , S.z).number is not a function）。--frozen-lockfile で再発を止める。
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Calculate next version
        id: tag_version
        # 上流が浮動メジャータグ(v6)を publish していないため、例外的に v6.2 で固定する。
        # @v6 は存在せずワークフローが壊れる。上流は node20 のままで、Node24強制の
        # 非推奨警告はこちら側では解消できない。
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Update package.json version
        run: |
          npm version ${{ steps.tag_version.outputs.new_version }} --no-git-tag-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # リリースのゲート。ここが赤ならタグもリリースも作られない。
      # test.yml と同じ内容だが、PR経由せず main に直接 push された場合でも
      # 無検証で公開されないよう、リリース経路にも独立して置く。
      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build and Package
        # Build with the new version in package.json
        run: |
          pnpm build
          pnpm package

      - name: Create CRX
        run: |
          echo "${{ secrets.CRX_PRIVATE_KEY }}" > /tmp/extension.pem
          npx crx3 build/chrome-mv3-prod -o build/chrome-mv3-prod.crx -p /tmp/extension.pem
          rm /tmp/extension.pem

      - name: Package native host
        # Claude Code（サブスク）経由の生成用。使う人だけが WSL で install.sh を実行する
        run: zip -j build/lunagen-native-host.zip native-host/install.sh native-host/lunagen_claude.py

      - name: Commit and Push Version Bump
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.tag_version.outputs.new_version }} [skip ci]"
          git push

      - name: Create Tag
        # 上流が浮動メジャータグ(v6)を publish していないため、例外的に v6.2 で固定する。
        # @v6 は存在せずワークフローが壊れる。上流は node20 のままで、Node24強制の
        # 非推奨警告はこちら側では解消できない。
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.tag_version.outputs.new_version }}
          tag_prefix: "v"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.tag_version.outputs.new_version }}
          name: Release v${{ steps.tag_version.outputs.new_version }}
          body: ${{ steps.tag_version.outputs.changelog }}
          generate_release_notes: true
          files: |
            build/chrome-mv3-prod.zip
            build/chrome-mv3-prod.crx
            build/lunagen-native-host.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
