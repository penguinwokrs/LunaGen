name: "Auto Release on Merge"

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # コミット件名/本文に [skip release] を含む push はリリースを切らない。
    # push の HEAD コミットのメッセージを見るため、複数コミットを一度に push する
    # 場合は最後のコミットに付けること。他のワークフロー(テスト等)は通常どおり動く。
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Calculate next version
        id: tag_version
        # 上流が浮動メジャータグ(v6)を publish していないため、例外的に v6.2 で固定する。
        # @v6 は存在せずワークフローが壊れる。上流は node20 のままで、Node24強制の
        # 非推奨警告はこちら側では解消できない。
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Update package.json version
        run: |
          npm version ${{ steps.tag_version.outputs.new_version }} --no-git-tag-version

      - name: Install dependencies
        run: pnpm install

      - name: Build and Package
        # Build with the new version in package.json
        run: |
          pnpm build
          pnpm package

      - name: Create CRX
        run: |
          echo "${{ secrets.CRX_PRIVATE_KEY }}" > /tmp/extension.pem
          npx crx3 build/chrome-mv3-prod -o build/chrome-mv3-prod.crx -p /tmp/extension.pem
          rm /tmp/extension.pem

      - name: Commit and Push Version Bump
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.tag_version.outputs.new_version }} [skip ci]"
          git push

      - name: Create Tag
        # 上流が浮動メジャータグ(v6)を publish していないため、例外的に v6.2 で固定する。
        # @v6 は存在せずワークフローが壊れる。上流は node20 のままで、Node24強制の
        # 非推奨警告はこちら側では解消できない。
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.tag_version.outputs.new_version }}
          tag_prefix: "v"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.tag_version.outputs.new_version }}
          name: Release v${{ steps.tag_version.outputs.new_version }}
          body: ${{ steps.tag_version.outputs.changelog }}
          generate_release_notes: true
          files: |
            build/chrome-mv3-prod.zip
            build/chrome-mv3-prod.crx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
