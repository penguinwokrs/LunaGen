name: "Release Extension"
on:
  # TEMP: マージ前の実機検証用。マージ前に削除する
  push:
    branches: [feat/claude-code-provider]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release title'
        required: true
        default: 'Release v1.0.0'
      body:
        description: 'Release description'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the extension
        run: pnpm build

      - name: Package the extension
        run: pnpm package

      - name: Create CRX
        run: |
          echo "${{ secrets.CRX_PRIVATE_KEY }}" > /tmp/extension.pem
          npx crx3 build/chrome-mv3-prod -o build/chrome-mv3-prod.crx -p /tmp/extension.pem
          rm /tmp/extension.pem

      - name: Package native host
        # Claude Code（サブスク）経由の生成用。使う人だけが WSL で install.sh を実行する
        run: zip -j build/lunagen-native-host.zip native-host/install.sh native-host/lunagen_claude.py

      - name: "TEMP: show native host zip"
        run: unzip -l build/lunagen-native-host.zip && ls -la build/*.zip build/*.crx

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_title }}
          body: ${{ github.event.inputs.body }}
          generate_release_notes: true
          files: |
            build/chrome-mv3-prod.zip
            build/chrome-mv3-prod.crx
            build/lunagen-native-host.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
